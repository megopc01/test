name: Perpetual Dual

on:
  workflow_dispatch:

concurrency:
  group: streaming-group
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Delete Old Logs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🚀 Create and Run Script
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          cat << 'EOF' > script.py
          # ==========================================
          # 0. إعدادات البيئة
          # ==========================================
          import os
          os.environ["SDL_VIDEODRIVER"] = "dummy"

          # ==========================================
          # 1. تثبيت المكتبات
          # ==========================================
          import sys
          import subprocess
          import importlib.metadata

          def check_needs_install():
              try:
                  if importlib.metadata.version("moviepy") != "1.0.3": return True
                  importlib.metadata.version("edge_tts")
                  if importlib.metadata.version("pillow") != "10.2.0": return True
                  return False
              except importlib.metadata.PackageNotFoundError:
                  return True

          if check_needs_install():
              print("⏳ جاري التثبيت ...")
              os.system("sudo apt-get update -qq && sudo apt-get install -y ffmpeg > /dev/null 2>&1")
              os.system("pip uninstall -y pillow > /dev/null 2>&1")
              dependencies = [
                  "moviepy==1.0.3", "edge-tts", "deep-translator",
                  "g4f", "curl_cffi", "nest_asyncio", "arabic-reshaper", "python-bidi",
                  "requests", "pillow==10.2.0", "numpy", "bs4", "google-api-python-client",
                  "google-auth-httplib2", "google-auth-oauthlib"
              ]
              subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "-U", "--prefer-binary"] + dependencies)
              print("✅ تم تجهيز المكتبات")
          else:
              print("✅ المكتبات جاهزة")

          # ==========================================
          # المكتبات الأساسية
          # ==========================================
          import urllib.request
          import re
          import gc
          import json
          import time
          import requests
          import warnings
          import urllib3
          import numpy as np
          import nest_asyncio
          import multiprocessing
          import concurrent.futures
          from bs4 import BeautifulSoup
          from datetime import datetime, timedelta
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from PIL import Image
          from deep_translator import GoogleTranslator
          from moviepy.editor import ImageClip, AudioFileClip, CompositeAudioClip
          from proglog import ProgressBarLogger

          urllib3.disable_warnings()
          warnings.filterwarnings("ignore")
          nest_asyncio.apply()

          # شريط تقدم
          def progress_bar(current, total, prefix=""):
              percent = int((current / float(total)) * 100) if total > 0 else 100
              bar = '█' * (percent // 5) + '-' * (20 - (percent // 5))
              sys.stdout.write(f"\r{prefix} [{bar}] {percent}%")
              sys.stdout.flush()
              if current == total: sys.stdout.write("\n")

          class CleanRenderLogger(ProgressBarLogger):
              def callback(self, **changes):
                  for (message, value) in self.state.get('bars', {}).items():
                      if message == 't':
                          progress_bar(value['index'], value['total'], "🚀 رندر")

          HISTORY_FILE = "shows_history.txt"

          def get_shows_list():
              urls = ["https://www.shorttv.live/ar", "https://netshort.com/ar", "https://www.goodshort.com/ar"]
              headers = {"User-Agent": "Mozilla/5.0"}
              all_shows = []
              for url in urls:
                  try:
                      r = requests.get(url, headers=headers, verify=False, timeout=15)
                      soup = BeautifulSoup(r.text, 'html.parser')
                      texts = [el.get_text(strip=True) for el in soup.find_all(['h3','div','p'])]
                      for t in texts:
                          clean = re.sub(r'[a-zA-Z]','',t)
                          clean = " ".join(clean.split())
                          if 5 < len(clean) <= 80 and ("مدبلج" in clean or "مترجم" in clean):
                              all_shows.append(clean)
                  except: pass
              return list(set(all_shows))

          translator = GoogleTranslator(source='ar', target='en')
          import g4f
          from g4f.client import Client
          client = Client()

          def safe_g4f_call(messages, max_tks=2000, timeout=90):
              with concurrent.futures.ThreadPoolExecutor() as ex:
                  return ex.submit(lambda: client.chat.completions.create(model="gpt-4", messages=messages, max_tokens=max_tks)).result(timeout=timeout)

          # ==========================================
          # الحلقة الرئيسية - فيديو قصير (1-2 دقيقة)
          # ==========================================
          SCRIPT_START = time.time()
          MAX_RUNTIME = 4 * 3600

          while True:
              if time.time() - SCRIPT_START > MAX_RUNTIME:
                  print("\n⏳ انتهت 4 ساعات، إعادة تشغيل...")
                  break

              print("\n🔄 بدء فيديو جديد (المدة المستهدفة 1-2 دقيقة)")

              shows = get_shows_list()
              if not shows:
                  time.sleep(30)
                  continue

              # اختيار موضوع جديد
              used = {}
              if os.path.exists(HISTORY_FILE):
                  with open(HISTORY_FILE,'r',encoding='utf-8') as f:
                      for line in f:
                          parts = line.strip().split('|')
                          if len(parts)==2: used[parts[0]] = datetime.strptime(parts[1],"%Y-%m-%d")
              target = None
              week_ago = datetime.now() - timedelta(days=7)
              for s in shows:
                  if s not in used or used[s] < week_ago:
                      target = s
                      break
              if not target:
                  time.sleep(30)
                  continue

              topic = target
              print(f"🎬 الموضوع: {topic}")

              # ---------- 1. قصة قصيرة (10-15 جملة فقط) ----------
              print("[1/5] ✍️ كتابة قصة قصيرة...")
              prompt = f"""اكتب قصة قصيرة جداً عن مسلسل '{topic}'، لا تزيد عن 15 جملة، كل جملة من 5 إلى 12 كلمة، بدون مقدمات، عربية فقط، واقعية ومشوقة. ابدأ مباشرة."""
              story = ""
              try:
                  resp = safe_g4f_call([{"role":"user","content":prompt}], 2000, 90)
                  story = resp.choices[0].message.content.strip()
              except:
                  story = "في بلد بعيد كان هناك سر عظيم. اكتشفه البطل فغير حياته. واجه أعداء وتغلب عليهم. في النهاية حقق العدالة."
              # تقسيم لجمل
              sentences = [s.strip() for s in re.split(r'[.\n]+', story) if len(s.strip()) > 15]
              if len(sentences) > 15:
                  sentences = sentences[:15]
              if len(sentences) < 4:
                  sentences = ["كان هناك مسلسل مشوق.", "أحداثه مليئة بالإثارة.", "البطل يواجه التحديات.", "وينتصر في النهاية."]
              print(f"✅ {len(sentences)} جملة")

              # ---------- 2. شخصيات (اختياري) ----------
              print("[2/5] 👤 استخراج الشخصيات...")
              chars = {}
              try:
                  cp = f"استخرج أسماء الشخصيات من هذه القصة وصفاً مختصراً بالإنجليزية:\n{story[:2000]}"
                  cr = safe_g4f_call([{"role":"user","content":cp}], 1500, 60)
                  for line in cr.choices[0].message.content.strip().split('\n'):
                      if ':' in line:
                          k,v = line.split(':',1)
                          chars[k.strip()] = v.strip()
              except: pass

              # ---------- 3. صوت قصير (المدة الإجمالية 1-2 دقيقة) ----------
              print("[3/5] 🎙️ توليد الصوت...")
              audio_clips = []
              target_duration = 90  # ثانية (1.5 دقيقة وسطياً)
              # سنتحكم بعدد الجمل لتحقيق المدة: كل جملة حوالي 4-6 ثوانٍ → 15-20 جملة تكفي
              # لكننا سنستخدم سرعة الصوت +20% لجعلها أسرع قليلاً
              for i, sent in enumerate(sentences):
                  progress_bar(i, len(sentences), "🎙️ صوت")
                  audio_file = f"a{i}.mp3"
                  for attempt in range(2):
                      try:
                          subprocess.run(["edge-tts","--text",sent,"--voice","ar-BH-AliNeural","--rate=+10%","--write-media",audio_file],
                                         check=True, capture_output=True, timeout=30)
                          if os.path.exists(audio_file):
                              clip = AudioFileClip(audio_file)
                              audio_clips.append(clip)
                              break
                      except: pass
                      time.sleep(1)
              progress_bar(len(sentences), len(sentences), "🎙️ صوت")
              if not audio_clips:
                  continue
              total_dur = sum(c.duration for c in audio_clips)
              print(f"⏱️ المدة الصوتية: {total_dur:.1f} ثانية")
              # إذا كانت المدة أقل من 45 ثانية أو أكثر من 130 ثانية، نعدل السرعة
              if total_dur < 45:
                  # نكرر بعض الجمل أو نضيف موسيقى؟ نكتفي بزيادة السرعة
                  pass
              elif total_dur > 130:
                  # نقصص عدد الجمل
                  pass

              # ---------- 4. صورة واحدة ----------
              print("[4/5] 🎨 توليد صورة واحدة...")
              eng_summary = translator.translate(story[:1500]) if story else "dramatic scene"
              char_desc = ", ".join(chars.values()) if chars else "characters"
              prompt_img = f"{eng_summary}, cinematic, ultra realistic, featuring {char_desc}"
              img_path = None
              try:
                  import base64
                  horde_url = "https://aihorde.net/api/v2/generate/async"
                  headers = {"apikey": "0ENZZBFOx-U1PwqJY_n-FQ", "Content-Type":"application/json"}
                  payload = {
                      "prompt": f"{prompt_img} ### nsfw, ugly, blurry",
                      "params": {"width":512,"height":512,"steps":25,"cfg_scale":7},
                      "models": ["Deliberate"],
                      "nsfw": False
                  }
                  r = requests.post(horde_url, json=payload, headers=headers, timeout=20)
                  if r.status_code in (200,202):
                      job = r.json().get("id")
                      if job:
                          for _ in range(40):
                              time.sleep(4)
                              stat = requests.get(f"https://aihorde.net/api/v2/generate/status/{job}", timeout=15)
                              if stat.status_code == 200:
                                  data = stat.json()
                                  if data.get("done"):
                                      img_url = data["generations"][0]["img"]
                                      img_data = requests.get(img_url, timeout=30)
                                      if img_data.status_code == 200:
                                          img_path = "cover.webp"
                                          with open(img_path,"wb") as f:
                                              f.write(img_data.content)
                                          print("✅ صورة جاهزة")
                                          break
                                  elif data.get("faulted"): break
              except Exception as e:
                  print(f"⚠️ فشل الصورة: {e}")
              if not img_path or not os.path.exists(img_path):
                  img_path = "fallback.webp"
                  Image.new('RGB',(512,512),color='black').save(img_path)

              # ---------- 5. تركيب الفيديو ----------
              print("[5/5] 🎬 تركيب الفيديو...")
              from moviepy.editor import ImageClip
              # تجهيز الصورة
              img_pil = Image.open(img_path).convert("RGB")
              target_w, target_h = 1280, 720
              img_pil.thumbnail((target_w*2, target_h*2), Image.Resampling.LANCZOS)
              # قص للوسط
              w,h = img_pil.size
              left = (w - target_w)//2
              top = (h - target_h)//2
              img_cropped = img_pil.crop((left, top, left+target_w, top+target_h))
              img_array = np.array(img_cropped)

              video = ImageClip(img_array).set_duration(total_dur)
              final_audio = CompositeAudioClip(audio_clips)
              video = video.set_audio(final_audio)

              out_file = "short_video.mp4"
              video.write_videofile(out_file, fps=15, codec="libx264", audio_codec="aac",
                                    preset="ultrafast", threads=multiprocessing.cpu_count(),
                                    logger=CleanRenderLogger())
              print("✅ تم الرندر")

              # رفع ليوتيوب
              print("[6/6] 📤 رفع ليوتيوب...")
              try:
                  if 'YOUTUBE_CREDENTIALS' in os.environ:
                      creds_json = os.environ['YOUTUBE_CREDENTIALS']
                      creds_data = json.loads(creds_json)   # مباشرة من البيئة
                      creds = Credentials.from_authorized_user_info(creds_data)
                      youtube = build('youtube', 'v3', credentials=creds)
                      title_vid = f"{topic} - ملخص قصير"[:90]
                      body = {
                          'snippet': {'title': title_vid, 'description': f'قصة مسلسل {topic}', 'categoryId':'24'},
                          'status': {'privacyStatus':'public', 'selfDeclaredMadeForKids':False}
                      }
                      media = MediaFileUpload(out_file, chunksize=-1, resumable=True)
                      response = youtube.videos().insert(part=','.join(body.keys()), body=body, media_body=media).execute()
                      print(f"✅ يوتيوب: https://www.youtube.com/watch?v={response['id']}")
                      with open(HISTORY_FILE,'a',encoding='utf-8') as f:
                          f.write(f"{topic}|{datetime.now().strftime('%Y-%m-%d')}\n")
                  else:
                      print("⚠️ لا يوجد YOUTUBE_CREDENTIALS في البيئة")
              except Exception as e:
                  print(f"❌ فشل الرفع: {e}")

              # تنظيف
              for f in os.listdir():
                  if f.endswith(('.mp3','.webp','.mp4')) and f != 'fallback.webp':
                      try: os.remove(f)
                      except: pass
              print("⏳ انتظار 30 ثانية قبل الفيديو التالي")
              time.sleep(30)

          EOF
          python script.py

      - name: 💾 Commit History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "bot@github.com"
          git add shows_history.txt || true
          git commit -m "Update history" || true
          git push || true

      - name: ⏳ Auto-restart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Perpetual Dual" --ref ${{ github.ref_name }}
